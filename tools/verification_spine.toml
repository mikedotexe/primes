[[entry]]
id = "chaos_threshold_translation_report"
tier = "report_bundle"
verify_mode = "bundle_manifest"
generator_cmd = [
  "cargo",
  "run",
  "--release",
  "--example",
  "chaos_threshold_translation_report",
  "--",
  "--out-dir",
  "/tmp/primes_chaos_threshold_translation",
]
bundle_dir = "/tmp/primes_chaos_threshold_translation"
expected_outputs = [
  "pair_threshold_rows.csv",
  "base_m_rows.csv",
  "metaphor_translation_rows.csv",
  "summary.json",
  "report.md",
  "threshold_curve.png",
  "threshold_decomposition_bars.png",
  "threshold_regime_grid.png",
]
owner_doc = "examples/README.md"


[package]
name = "density-explorer"
version = "0.1.0"
edition = "2021"
description = "Prime density exploration for symmetric zero-padding templates"
license = "MIT"
authors = ["Collaborative PE"]

[dependencies]
rand = "0.8"
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
rayon = "1.10"
statrs = "0.16"

[package]
name = "hz"
version = "0.1.0"
edition = "2021"
description = "Post-processing CLI for prime-density grids"
license = "MIT"
authors = ["Collaborative PE"]

[[bin]]
name = "hz"
path = "src/main.rs"

[dependencies]
primes = { path = "../.." }
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package]
name = "hz"
version = "0.1.0"
edition = "2021"

# If your workspace crate name isn't "primes", change the dependency key and `use` paths below.
[dependencies.primes]
path = "../.."

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "hz"
path = "src/main.rs"

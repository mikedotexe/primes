name: Agda Formal Verification

on:
  workflow_call:
  workflow_dispatch:

env:
  AGDA_STDLIB_VERSION: "v2.3"

jobs:
  verify:
    runs-on: ubuntu-latest
    # Agda installation via apt may not provide a compatible version.
    # This job is best-effort -- local verification is the ground truth.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache Agda stdlib
        id: cache-agda-stdlib
        uses: actions/cache@v4
        with:
          path: ~/.agda
          key: agda-stdlib-${{ env.AGDA_STDLIB_VERSION }}-${{ runner.os }}

      - name: Install Agda
        run: |
          sudo apt-get update
          sudo apt-get install -y agda || true
          agda --version || echo "Agda installation failed"

      - name: Setup Agda Standard Library
        if: steps.cache-agda-stdlib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.AGDA_STDLIB_VERSION }} \
            https://github.com/agda/agda-stdlib.git ~/.agda/agda-stdlib
          mkdir -p ~/.agda
          echo "$HOME/.agda/agda-stdlib/standard-library.agda-lib" > ~/.agda/libraries
          echo "standard-library-2.3" > ~/.agda/defaults

      - name: Register project library
        run: |
          echo "$(pwd)/agda-proofs/prime-physics-engine.agda-lib" >> ~/.agda/libraries

      - name: Verify maintained clean spine
        working-directory: agda-proofs
        run: |
          ./scripts/verify-clean-spine.sh

name: Agda Formal Verification

on:
  workflow_call:
  workflow_dispatch:

env:
  AGDA_STDLIB_VERSION: "v2.3"

jobs:
  verify:
    runs-on: ubuntu-latest
    # Agda installation via apt may not provide a compatible version.
    # This job is best-effort -- local verification is the ground truth.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache Agda stdlib
        id: cache-agda-stdlib
        uses: actions/cache@v4
        with:
          path: ~/.agda
          key: agda-stdlib-${{ env.AGDA_STDLIB_VERSION }}-${{ runner.os }}

      - name: Install Agda
        run: |
          sudo apt-get update
          sudo apt-get install -y agda || true
          agda --version || echo "Agda installation failed"

      - name: Setup Agda Standard Library
        if: steps.cache-agda-stdlib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.AGDA_STDLIB_VERSION }} \
            https://github.com/agda/agda-stdlib.git ~/.agda/agda-stdlib
          mkdir -p ~/.agda
          echo "$HOME/.agda/agda-stdlib/standard-library.agda-lib" > ~/.agda/libraries
          echo "standard-library-2.3" > ~/.agda/defaults

      - name: Register project library
        run: |
          echo "$(pwd)/agda-proofs/prime-physics-engine.agda-lib" >> ~/.agda/libraries

      - name: Verify passing modules (19 clean + 13 postulated = 32 total)
        working-directory: agda-proofs
        run: |
          echo "Verifying all 32 passing Agda modules..."
          echo "See agda-proofs/STATUS.md for ground truth."
          echo ""

          passed=0
          failed=0

          # 19 modules that pass clean (no postulates)
          clean_modules=(
            Theorems/Abstract/SymmetryImpliesRepulsion.agda
            Theorems/Abstract/SymmetryFromList.agda
            Theorems/Abstract/ConstrainedOrbitals.agda
            Core/Primality.agda
            Core/CRTVector.agda
            Core/Equiv.agda
            Core/ResidueFold.agda
            Specs/SpacingResidueModel.agda
            Specs/PalindromeEvenDivides.agda
            Specs/Tests.agda
            Advanced/Statistics.agda
            Dependencies.agda
            Test/SimpleImportTest.agda
            Tests/DevProofs.agda
            Theorems/ElbowsFromCSV.agda
            Theorems/GlobalElbowFacts.agda
            Theorems/MirrorObstruction.agda
            Theorems/RationalStatistics.agda
            Theorems/SpectralRigidity.agda
          )

          # 13 modules that pass with postulates
          postulated_modules=(
            Core/HonoraryZero.agda
            Theorems/Abstract/SymmetryFiniteReflect.agda
            Theorems/Abstract/BucketsAutoMatch.agda
            Theorems/Abstract/WindowCertificate.agda
            Examples/CertifiedResonanceComplete.agda
            Examples/CertifiedResonanceParam.agda
            Examples/CertifiedResonanceParamDyn.agda
            LagrangePoints/ZeroPaddedPrimes/Alphabet036.agda
            LagrangePoints/ZeroPaddedPrimes/Asymmetry.agda
            LagrangePoints/ZeroPaddedPrimes/Examples036.agda
            Theorems/BifurcationRoster.agda
            Theorems/ElbowEvents.agda
            Theorems/TotientDensity.agda
          )

          for module in "${clean_modules[@]}" "${postulated_modules[@]}"; do
            echo -n "  $module ... "
            if agda "$module" 2>/dev/null; then
              echo "OK"
              passed=$((passed + 1))
            else
              echo "FAIL"
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "Results: $passed passed, $failed failed out of 32"
          echo ""

          if [ $failed -gt 0 ]; then
            echo "Some modules failed. This may be due to Agda version mismatch."
            echo "Local verification with Agda 2.8.0 is the ground truth."
            echo "See agda-proofs/STATUS.md for expected results."
          fi

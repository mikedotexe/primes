name: Verification Artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  chaos-threshold-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev python3-matplotlib

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate full arithmetic artifact bundle
        run: |
          cargo run --release --example chaos_threshold_translation_report -- --full --out-dir /tmp/primes_chaos_threshold_translation_full

      - name: Generate full matplotlib visual bundle
        run: |
          python3 scripts/plot_chaos_threshold_translation.py \
            --input-dir /tmp/primes_chaos_threshold_translation_full \
            --out-dir /tmp/primes_chaos_threshold_translation_matplotlib_full

      - name: Upload arithmetic artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: chaos-threshold-arithmetic
          path: /tmp/primes_chaos_threshold_translation_full
          retention-days: 14

      - name: Upload visual artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: chaos-threshold-matplotlib
          path: /tmp/primes_chaos_threshold_translation_matplotlib_full
          retention-days: 14

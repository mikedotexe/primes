name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: prime-physics-engine-linux-amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: prime-physics-engine-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: prime-physics-engine-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: prime-physics-engine-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} --bin membrane-prime
        
      - name: Package Binary
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/membrane-prime.exe ${{ matrix.name }}
          else
            cp target/${{ matrix.target }}/release/membrane-prime ${{ matrix.name }}
          fi
          
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          files: |
            prime-physics-engine-*
          body: |
            ## Prime Physics Engine ${{ github.ref_name }}
            
            High-performance membrane prime generator with verified 33% success rate.
            
            ### Installation
            
            #### Cargo
            ```bash
            cargo install prime-physics-engine
            ```
            
            #### Binary
            Download the appropriate binary for your platform below.
            
            ### Changelog
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

  cargo-publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
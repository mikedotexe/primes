name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14, windows-latest]
        rust: [1.82.0, 1.70.0]  # Pinned version and MSRV
        include:
          # Add ARM64 testing for Apple Silicon
          - os: macos-14
            rust: 1.82.0
            name: "macOS 14 ARM64"
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ matrix.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ matrix.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ matrix.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt -- --check
        
      - name: Run clippy
        run: cargo clippy -- -D warnings
        
      - name: Build
        run: cargo build --verbose
        
      - name: Run tests
        run: cargo test --verbose
        
      - name: Build with all features
        run: cargo build --all-features --verbose
        if: matrix.os != 'windows-latest'  # Metal feature is macOS only
        
      - name: Test with no default features
        run: cargo test --no-default-features --verbose

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
          targets: wasm32-unknown-unknown
      
      - name: Check WASM build
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm
        
      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --no-default-features --features wasm
        
      - name: WASM Smoke Test
        run: |
          # Verify the WASM build produced output
          ls -la target/wasm32-unknown-unknown/debug/*.wasm
          # Check file size is reasonable (not empty)
          wasm_size=$(stat -f%z target/wasm32-unknown-unknown/debug/prime_physics_engine.wasm 2>/dev/null || stat -c%s target/wasm32-unknown-unknown/debug/prime_physics_engine.wasm)
          if [ "$wasm_size" -lt 1000 ]; then
            echo "WASM file seems too small: $wasm_size bytes"
            exit 1
          fi
          echo "WASM build successful: $wasm_size bytes"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --all-features

  examples:
    name: Verify Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      
      - name: Check verified examples compile
        run: |
          for example in examples/verified/*.rs; do
            name=$(basename "$example" .rs)
            echo "Checking example: $name"
            cargo check --example "$name"
          done
          
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
        
      - name: Generate coverage
        run: cargo tarpaulin --verbose --workspace --timeout 120 --out xml
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./cobertura.xml
          fail_ci_if_error: false
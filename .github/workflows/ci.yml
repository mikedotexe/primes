name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering for testing

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check verified production examples
        run: |
          echo "Testing production-ready verified examples..."
          count=0
          for example in examples/verified/*.rs; do
            if [ -f "$example" ]; then
              name=$(basename "$example" .rs)
              echo "[$((count + 1))] Checking: $name"
              cargo check --example "$name"
              count=$((count + 1))
            fi
          done
          echo "✓ Verified $count production examples"

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering for testing

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14, windows-latest]
        rust: [stable, 1.80.0]  # Current stable and MSRV (required by rayon 1.11+)
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ matrix.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ matrix.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ matrix.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt -- --check
        
      - name: Run clippy
        run: cargo clippy -- -D warnings
        
      - name: Build
        run: cargo build --verbose
        
      - name: Run tests
        run: cargo test --verbose
        
      - name: Build with all features
        run: cargo build --all-features --verbose
        if: matrix.os != 'windows-latest'  # Metal feature is macOS only
        
      - name: Test with no default features
        run: cargo test --no-default-features --verbose

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Check WASM build
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm
        
      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --no-default-features --features wasm
        
      - name: WASM Smoke Test
        run: |
          # Verify the WASM build produced output
          ls -la target/wasm32-unknown-unknown/debug/*.wasm
          # Check file size is reasonable (not empty) - use portable stat command
          if [[ "$OSTYPE" == "darwin"* ]]; then
            wasm_size=$(stat -f%z target/wasm32-unknown-unknown/debug/prime_physics_engine.wasm)
          else
            wasm_size=$(stat -c%s target/wasm32-unknown-unknown/debug/prime_physics_engine.wasm)
          fi
          if [ "$wasm_size" -lt 1000 ]; then
            echo "WASM file seems too small: $wasm_size bytes"
            exit 1
          fi
          echo "WASM build successful: $wasm_size bytes"

  examples:
    name: Verify Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check core examples compile
        run: |
          # Verify key examples compile
          examples=(
            "proper_membrane_generator"
            "lagrange_verification"
            "check_prime"
            "prime_count_smoke_test"
            "statistical_prime_generator"
          )

          for example in "${examples[@]}"; do
            echo "Checking example: $example"
            cargo check --example "$example" || exit 1
          done

          echo "✅ All examples compile successfully"


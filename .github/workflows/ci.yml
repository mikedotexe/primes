name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering for testing

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev python3-matplotlib

      - uses: dtolnay/rust-toolchain@stable

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          lake-package-directory: lean-proofs

  # Agda verification (best-effort -- Agda version on ubuntu-latest may differ)
  # See agda-proofs/STATUS.md for ground truth (verified locally with Agda 2.8.0)
  agda-verification:
    uses: ./.github/workflows/agda-verification.yml

  verification-spine:
    runs-on: ubuntu-latest
    needs: [test, lean-build]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev python3-matplotlib

      - uses: dtolnay/rust-toolchain@stable

      - name: Verification spine check
        run: cargo run --bin verify_verification_spine -- check

  signal-spine-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev python3-matplotlib

      - uses: dtolnay/rust-toolchain@stable

      - name: Run signal spine smoke
        run: |
          SIGNAL_SPINE_RUN_ID=ci-smoke \
          SIGNAL_SPINE_OUT_DIR=/tmp/primes_signal_spine_smoke \
          scripts/signal_spine.sh core affine fast-generation base57-codec

      - name: Upload signal spine smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-spine-smoke
          path: |
            /tmp/primes_signal_spine_smoke/signal_summary.md
            /tmp/primes_signal_spine_smoke/run_manifest.json
            /tmp/primes_signal_spine_smoke/commands.tsv
            /tmp/primes_signal_spine_smoke/stdout/
          if-no-files-found: warn
          retention-days: 7

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Check production examples
        run: |
          echo "Testing production examples from root examples/ directory..."

          # Critical examples mentioned in documentation
          critical_examples=(
            "check_prime"
            "proper_membrane_generator"
            "statistical_prime_generator"
            "prime_count_smoke_test"
            "lagrange_verification"
            "lagrange_full_verification"
            "membrane_showcase"
            "comprehensive_base_analysis"
            "prime_verification_report"
          )

          count=0
          success=0
          for example in "${critical_examples[@]}"; do
            if [ -f "examples/${example}.rs" ]; then
              count=$((count + 1))
              echo "[$count] Checking: $example"
              if cargo check --example "$example" 2>&1; then
                success=$((success + 1))
              else
                echo "  ⚠️  Failed to check $example (continuing)"
              fi
            else
              echo "  ⚠️  ${example}.rs not found in examples/"
            fi
          done

          echo ""
          echo "✓ Successfully checked $success/$count critical examples"

[package]
name = "affine-arithmetic"
version = "0.1.0"
edition = "2021"
authors = ["mikedotexe"]
license = "MIT OR Apache-2.0"
description = "Rigorous affine arithmetic with correlation tracking - outperforms interval arithmetic by 40-60× on real problems"
repository = "https://github.com/mikedotexe/primes"
documentation = "https://docs.rs/affine-arithmetic"
homepage = "https://github.com/mikedotexe/primes/tree/main/affine-arithmetic"
keywords = ["interval", "arithmetic", "uncertainty", "error-propagation", "numerical"]
categories = ["mathematics", "science", "algorithms", "no-std"]
readme = "README.md"

[features]
default = ["std"]
std = []
rigorous = ["inari"]
hybrid = ["inari"]
serde = ["dep:serde"]

[dependencies]
# Only used when feature `rigorous` is enabled to compute outward-rounded bounds.
inari = { version = "2.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.5"

[package]
name = "affine-math"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Affine arithmetic core with optional rigorous backing via inari"
repository = "https://github.com/mikedotexe/primes"

[features]
default = ["std"]
std = []
rigorous = ["inari"]   # uses inari for outward-rounded interval ops (rho & hybrid)
hybrid = ["inari"]     # enables inari-backed hybrid fallbacks (optional)

[dependencies]
inari = { version = "1.0", optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "bench_affine_math"
harness = false

[package]
name = "affine-math"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Thin re-export wrapper for affine-arithmetic (for backward compatibility)"
repository = "https://github.com/mikedotexe/primes"

[features]
default = ["affine-arithmetic/default"]
std = ["affine-arithmetic/std"]
rigorous = ["affine-arithmetic/rigorous"]
hybrid = ["affine-arithmetic/hybrid"]

[dependencies]
affine-arithmetic = { version = "0.1.0", path = "../affine-arithmetic" }
